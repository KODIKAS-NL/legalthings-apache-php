; php2shell (CVE-2026-109618 / CVE-2026-109619) mitigation.
; PHP 7.4 is EOL and will not receive an upstream fix. The reported bugs live in the
; session upload progress handler (php_session_rfc1867_callback), which runs for every
; multipart POST before any application code. None of the services use upload progress.
; Loaded last (zz- prefix) so it overrides php.ini. PHP_INI_PERM: cannot be changed via ini_set().
session.upload_progress.enabled = Off
; Unguessable field name, in case upload progress is ever switched back on
session.upload_progress.name = "7522b2a36608c57f7a9a0bcbd9e7ff4d"
